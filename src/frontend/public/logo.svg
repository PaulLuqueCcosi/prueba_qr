<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="256" height="256" role="img" aria-label="Matrix QR">
  <title>Matrix QR</title>
  <style>
    .mark { fill: #18181b; }
    @media (prefers-color-scheme: dark) { .mark { fill: #fafafa; } }
  </style>
  <mask id="cells">
    <rect width="32" height="32" fill="#fff"/>
    <g fill="#000">
      <rect x="5" y="5" width="6" height="6" rx="1.5"/>
      <rect x="13" y="5" width="6" height="6" rx="1.5"/>
      <rect x="21" y="5" width="6" height="6" rx="1.5"/>
      <rect x="13" y="13" width="6" height="6" rx="1.5"/>
      <rect x="21" y="13" width="6" height="6" rx="1.5"/>
      <rect x="21" y="21" width="6" height="6" rx="1.5"/>
    </g>
    <g fill="#000" fill-opacity="0.5">
      <circle cx="8" cy="16" r="1.5"/>
      <circle cx="8" cy="24" r="1.5"/>
      <circle cx="16" cy="24" r="1.5"/>
    </g>
  </mask>
  <rect class="mark" width="32" height="32" rx="8" mask="url(#cells)"/>
</svg>
